name: Promote to Live

on:
  workflow_dispatch:

jobs:
  promote:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout test repo
        uses: actions/checkout@v4

      - name: Checkout live repo
        uses: actions/checkout@v4
        with:
          repository: pprashil26.github.io/timeblocks
          token: ${{ secrets.LIVE_REPO_TOKEN }}
          path: live-repo

      - name: Copy test index.html to live repo
        run: |
          cp index.html live-repo/index.html

      - name: Commit and push live update
        run: |
          cd live-repo
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add index.html

          if git diff --cached --quiet; then
            echo "No changes to promote."
          else
            git commit -m "Promote tested Timeblocks version to live"
            git push
          fi
